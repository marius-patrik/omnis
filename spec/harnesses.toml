version = 1

[shared]
capability = "omnis.capability.code.agent"
gateway = "http://127.0.0.1:7331"
logical_model = "omnis-code"
probe_timeout_ms = 2000
probe_output_max_bytes = 1048576

[harnesses.claude]
executable = "claude"
noninteractive_subcommand = ""
required_tokens = ["--print","--output-format","stream-json","--append-system-prompt","--model","--permission-mode"]
coverage = "full"
output = "jsonl"
args = ["--print","--output-format","stream-json","--model","omnis-code","--permission-mode","bypassPermissions"]
gateway_env = "ANTHROPIC_BASE_URL"
gateway_value = "http://127.0.0.1:7331/anthropic"
credential_env = "ANTHROPIC_AUTH_TOKEN"
model_env = "ANTHROPIC_MODEL"
model_env_value = "omnis-code"

[harnesses.codex]
executable = "codex"
noninteractive_subcommand = "exec"
required_tokens = ["exec","--json","--model","--sandbox","--cd","--ephemeral"]
coverage = "gateway"
output = "jsonl"
args = ["exec","--ephemeral","--json","--model","omnis-code","--sandbox","danger-full-access"]
gateway_env = "OPENAI_BASE_URL"
gateway_value = "http://127.0.0.1:7331/v1"
credential_env = "OPENAI_API_KEY"

[harnesses.opencode]
executable = "opencode"
noninteractive_subcommand = "run"
required_tokens = ["run","--format","json","--model","--dir","--standalone"]
coverage = "gateway"
output = "jsonl"
args = ["run","--standalone","--format","json","--model","omnis/omnis-code"]
credential_env = "OMNIS_OPENCODE_API_KEY"
config_provider = "omnis"
config_model = "omnis-code"
config_base_url = "http://127.0.0.1:7331/v1"
