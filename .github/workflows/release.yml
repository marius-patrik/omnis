name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@4f26dd3a4b23e120ac40c94836f3e065d1f82237
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4f26dd3a4b23e120ac40c94836f3e065d1f82237"
    secrets: inherit
