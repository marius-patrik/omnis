name: PR Approval and Auto-Merge

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy.
permissions:
  pull-requests: write
  contents: write
  issues: write
  repository-projects: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/pr-approval-automerge.yml@4f26dd3a4b23e120ac40c94836f3e065d1f82237
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 4f26dd3a4b23e120ac40c94836f3e065d1f82237
    secrets:
      DARKFACTORY_APP_PRIVATE_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
