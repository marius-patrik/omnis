name: Autonomous Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  actions: write

jobs:
  run-agent:
    # The agent stays off until its provider secrets exist. Set the repository variable
    # AGENT_ENABLED to "true" once ANTIGRAVITY_REFRESH_TOKEN, ANTIGRAVITY_CLIENT_ID, and
    # ANTIGRAVITY_CLIENT_SECRET are configured; until then every issue would otherwise start a
    # container build that cannot authenticate. `secrets` is not available in a job-level `if`,
    # which is why this gate is a variable and the step below re-checks the secret itself.
    if: vars.AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify provider credentials are present
        env:
          REFRESH_TOKEN: ${{ secrets.ANTIGRAVITY_REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::AGENT_ENABLED is true but ANTIGRAVITY_REFRESH_TOKEN is not set." >&2
            exit 1
          fi
          echo "Provider credentials present."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build agent container
        run: |
          docker build -t omnis-agent -f docker/Dockerfile.agent .

      - name: Dispatch agent in container
        run: |
          docker run --rm \
            -e ANTIGRAVITY_REFRESH_TOKEN="${{ secrets.ANTIGRAVITY_REFRESH_TOKEN }}" \
            -e ANTIGRAVITY_CLIENT_ID="${{ secrets.ANTIGRAVITY_CLIENT_ID }}" \
            -e ANTIGRAVITY_CLIENT_SECRET="${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}" \
            -e GH_TOKEN="${{ secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}" \
            -e GITHUB_EVENT_PATH="/workspace/event.json" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}" \
            -e PROJECT_NUMBER="${{ vars.PROJECT_NUMBER || 1 }}" \
            -v "${{ github.event_path }}:/workspace/event.json:ro" \
            -v "${{ github.workspace }}:/workspace" \
            omnis-agent dispatch

