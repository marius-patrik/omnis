name: Autonomous Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

# The runner, the container and the harness registry all come from the pinned pipeline. This file
# is a caller, not a copy.
#
# Every credential is passed explicitly: a called workflow sees the caller's secrets only when they
# are given to it. Each is optional upstream, so the ones this repository does not hold simply
# shorten the fallback chain rather than failing the run.
permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  actions: write

jobs:
  agent:
    uses: marius-patrik/DarkFactory/.github/workflows/agent.yml@4f26dd372b6c921316b0ee69d2d0b50a2e584f18
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 4f26dd372b6c921316b0ee69d2d0b50a2e584f18
      agent-enabled: ${{ vars.AGENT_ENABLED }}
    secrets: inherit

