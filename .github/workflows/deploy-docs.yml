name: Deploy Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The documentation build, the theme, the hooks and the version manifest all come from the pinned
# pipeline. This file is a caller, not a copy, so the switcher and the theme are shared rather than
# duplicated here.
permissions:
  contents: write
  deployments: write

# No `concurrency` here on purpose. The shared workflow already declares the `pages` group, and a
# caller holding the same group deadlocks the run it is calling: the callee queues behind a group
# its own caller owns, and the whole run fails before a single job starts.
jobs:
  deploy:
    uses: marius-patrik/DarkFactory/.github/workflows/deploy-docs.yml@69582bf743933597ee34a31dc2611b0f1972e1ab
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 69582bf743933597ee34a31dc2611b0f1972e1ab
