name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A caller, not a copy. Previews land under `pr-<N>/` beside the published site and are what the
# version switcher offers, so they come from the same pinned pipeline that builds the site.
permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@7585c73e7d00f8774627d05288bc3770003efe0d
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 7585c73e7d00f8774627d05288bc3770003efe0d
    secrets: inherit
