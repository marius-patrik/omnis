name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A caller, not a copy. Previews land under `pr-<N>/` beside the published site and are what the
# version switcher offers, so they come from the same pinned pipeline that builds the site.
permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@1e6bdb0c502deccf5b79b548f089fd07742981a7
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 1e6bdb0c502deccf5b79b548f089fd07742981a7
    secrets: inherit
