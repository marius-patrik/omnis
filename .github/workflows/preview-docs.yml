name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A caller, not a copy. Previews land under `pr-<N>/` beside the published site and are what the
# version switcher offers, so they come from the same pinned pipeline that builds the site.
permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@826f883ab1b7363a9bdbb39cf30af3437e5691ee
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 826f883ab1b7363a9bdbb39cf30af3437e5691ee
    secrets: inherit
