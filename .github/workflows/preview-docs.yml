name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A caller, not a copy. Previews land under `pr-<N>/` beside the published site and are what the
# version switcher offers, so they come from the same pinned pipeline that builds the site.
permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@f0d838e891c73656952ca18bc49a8cae871dfed5
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: f0d838e891c73656952ca18bc49a8cae871dfed5
