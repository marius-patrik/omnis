name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A caller, not a copy. Previews land under `pr-<N>/` beside the published site and are what the
# version switcher offers, so they come from the same pinned pipeline that builds the site.
permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@56e369b18af1151b2cc651b953796435fc39d6c3
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 56e369b18af1151b2cc651b953796435fc39d6c3
