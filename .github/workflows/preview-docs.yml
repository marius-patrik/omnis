name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A caller, not a copy. Previews land under `pr-<N>/` beside the published site and are what the
# version switcher offers, so they come from the same pinned pipeline that builds the site.
permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@4f26dd3a4b23e120ac40c94836f3e065d1f82237
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 4f26dd3a4b23e120ac40c94836f3e065d1f82237
    secrets: inherit
